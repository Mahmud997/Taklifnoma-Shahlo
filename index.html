<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Шахло & Миржалол — Таклифнома</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-bright: #e8d48b;
      --gold-deep: #8a6d1d;
      --burgundy: #5c1a26;
      --burgundy-deep: #2e0c14;
      --rose: #a84a58;
      --cream: #fdf8ef;
      --ivory: #fffbf5;
      --deep: #1a0c0e;
      --wine: #3d1520;
      --blush: #f5e6e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: #0a0507;
    }

    /* ========== ENVELOPE ========== */
    #envelope-scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 90% 70% at 50% 35%, #3a1520 0%, transparent 55%),
        radial-gradient(ellipse at center, #1f0c12 0%, #0a0507 75%);
      z-index: 100;
      transition: opacity 1.5s ease, visibility 1.5s;
    }
    #envelope-scene.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .env-glow {
      position: absolute;
      width: 420px;
      height: 300px;
      background: radial-gradient(ellipse, rgba(201, 168, 76, 0.22) 0%, transparent 70%);
      filter: blur(50px);
      animation: glowPulse 3.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .envelope-wrapper {
      position: relative;
      width: min(370px, 90vw);
      height: min(255px, 64vw);
      cursor: pointer;
      perspective: 1500px;
      z-index: 2;
    }

    .envelope { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #2a0f16 0%, #4a1a28 30%, #3a1520 65%, #240d13 100%);
      border-radius: 10px;
      box-shadow:
        0 30px 70px rgba(0,0,0,0.75),
        0 0 0 1.5px rgba(201, 168, 76, 0.45),
        inset 0 1px 0 rgba(255, 230, 180, 0.12),
        inset 0 -10px 35px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .envelope-body::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1.5px solid rgba(201, 168, 76, 0.5);
      border-radius: 5px;
      pointer-events: none;
    }
    .envelope-body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 8c-4 10-10 16-20 20 10 4 16 10 20 20 4-10 10-16 20-20-10-4-16-10-20-20z' fill='%23c9a84c' fill-opacity='0.07'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      background: radial-gradient(circle at 30% 25%, #d47882, #a33a48 50%, #5c1a26 85%, #2e0c14);
      border-radius: 50%;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.6),
        0 0 0 3px rgba(201, 168, 76, 0.55),
        0 0 0 7px rgba(92, 26, 38, 0.45),
        inset 0 3px 10px rgba(255,255,255,0.22),
        inset 0 -5px 12px rgba(0,0,0,0.4);
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.45s;
    }
    .seal::before {
      content: '';
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(255, 210, 210, 0.3);
      border-radius: 50%;
    }
    .seal-inner {
      width: 28px;
      height: 28px;
      position: relative;
    }
    .seal-inner svg { width: 100%; height: 100%; fill: #f5d0d4; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35)); }

    .envelope-wrapper.opened .seal {
      transform: translate(-50%, -50%) scale(0) rotate(50deg);
      opacity: 0;
    }

    .flap {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 57%;
      background: linear-gradient(175deg, #5a2030 0%, #3d1520 55%, #2a0f16 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 1.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .flap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(201,168,76,0.22) 0%, transparent 45%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .envelope-wrapper.opened .flap { transform: rotateX(185deg); }

    .letter-peek {
      position: absolute;
      bottom: 9%;
      left: 7%;
      right: 7%;
      height: 74%;
      background: linear-gradient(180deg, #fffbf5 0%, #f7ebd8 100%);
      border-radius: 6px 6px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.22);
      transform: translateY(48%);
      transition: transform 1.4s 0.28s cubic-bezier(0.34, 1.3, 0.64, 1);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .envelope-wrapper.opened .letter-peek { transform: translateY(-20%); }

    .letter-peek-text {
      font-family: 'Great Vibes', cursive;
      font-size: 34px;
      background: linear-gradient(135deg, #8a6d1d, #c9a84c, #e8d48b, #c9a84c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
    }
    .letter-peek-sub {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--gold-deep);
      opacity: 0.75;
      text-transform: uppercase;
    }

    .env-corner {
      position: absolute;
      width: 36px;
      height: 36px;
      z-index: 4;
      opacity: 0.9;
    }
    .env-corner.tl { top: 18px; left: 18px; }
    .env-corner.tr { top: 18px; right: 18px; transform: scaleX(-1); }
    .env-corner.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
    .env-corner.br { bottom: 18px; right: 18px; transform: scale(-1); }
    .env-corner svg {
      width: 100%;
      height: 100%;
      fill: var(--gold);
      filter: drop-shadow(0 0 4px rgba(201,168,76,0.45));
    }

    .tap-hint {
      margin-top: 52px;
      color: var(--gold-bright);
      font-size: 13px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: 0.85;
      animation: pulseHint 2.4s ease-in-out infinite;
      font-family: 'Cinzel', serif;
      text-shadow: 0 0 24px rgba(201,168,76,0.45);
      z-index: 2;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    #envelope-scene.hidden .tap-hint { opacity: 0; }

    /* ========== INVITATION ========== */
    #invitation-scene {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.7s ease 0.15s, visibility 1.7s 0.15s;
      background:
        radial-gradient(ellipse 110% 70% at 50% -5%, #4a1520 0%, transparent 48%),
        radial-gradient(ellipse at 15% 85%, rgba(92,26,38,0.3) 0%, transparent 42%),
        radial-gradient(ellipse at 85% 75%, rgba(138,109,29,0.12) 0%, transparent 40%),
        linear-gradient(170deg, #0a0507 0%, #1a0c0e 45%, #10080c 100%);
      z-index: 50;
    }
    #invitation-scene.visible {
      opacity: 1;
      visibility: visible;
    }

    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .side-floral {
      position: fixed;
      width: 140px;
      height: 280px;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 2s ease 1.2s;
    }
    #invitation-scene.visible .side-floral { opacity: 0.55; }
    .side-floral.left { left: -20px; top: 18%; }
    .side-floral.right { right: -20px; top: 22%; transform: scaleX(-1); }
    .side-floral svg { width: 100%; height: 100%; }

    .card {
      position: relative;
      max-width: 470px;
      margin: 32px auto 80px;
      padding: 0;
      background: linear-gradient(175deg, #fffbf5 0%, #f8ebd4 45%, #f2e2c0 100%);
      border-radius: 16px;
      box-shadow:
        0 0 0 1px rgba(201, 168, 76, 0.55),
        0 0 0 5px rgba(92, 26, 38, 0.22),
        0 35px 100px rgba(0,0,0,0.7),
        0 0 160px rgba(201, 168, 76, 0.1);
      overflow: hidden;
      z-index: 20;
      animation: cardReveal 1.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(90px) scale(0.9); filter: blur(10px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 5s ease-in-out 1.8s infinite;
      pointer-events: none;
      z-index: 12;
    }
    @keyframes shimmer {
      0% { left: -120%; }
      35%, 100% { left: 160%; }
    }

    .card-inner {
      margin: 12px;
      border: 1.5px solid rgba(201, 168, 76, 0.5);
      border-radius: 10px;
      padding: 42px 28px 38px;
      position: relative;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,250,240,0.98) 0%, transparent 55%),
        linear-gradient(180deg, #fffbf5, #f4e6c8);
    }
    .card-inner::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(201, 168, 76, 0.22);
      border-radius: 7px;
      pointer-events: none;
    }

    .floral-top {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
      opacity: 0.9;
    }
    .floral-top svg {
      width: 180px;
      height: 36px;
      fill: var(--gold);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08));
    }

    .ornament {
      position: absolute;
      width: 56px;
      height: 56px;
      opacity: 0.85;
      z-index: 2;
    }
    .ornament.tl { top: 8px; left: 8px; }
    .ornament.tr { top: 8px; right: 8px; transform: scaleX(-1); }
    .ornament.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
    .ornament.br { bottom: 8px; right: 8px; transform: scale(-1); }
    .ornament svg {
      width: 100%;
      height: 100%;
      fill: var(--gold);
      filter: drop-shadow(0 0 5px rgba(201,168,76,0.3));
    }

    .header { text-align: center; margin-bottom: 10px; }

    .bismillah {
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      background: linear-gradient(90deg, #8a6d1d, #c9a84c, #e8d48b, #c9a84c, #8a6d1d);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: goldShine 6s linear infinite;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    @keyframes goldShine { to { background-position: 200% center; } }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--gold-deep);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .greeting {
      font-size: 16px;
      color: #4a3028;
      line-height: 1.55;
    }

    .names {
      text-align: center;
      margin: 22px 0 12px;
    }
    .name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(42px, 11.5vw, 56px);
      line-height: 1.1;
      background: linear-gradient(145deg, #2e0c14 0%, #5c1a26 35%, #8a6d1d 70%, #5c1a26 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: nameGlow 3.5s ease-in-out infinite alternate;
    }
    @keyframes nameGlow {
      from { filter: drop-shadow(0 2px 1px rgba(0,0,0,0.06)); }
      to { filter: drop-shadow(0 2px 10px rgba(201,168,76,0.4)); }
    }

    .ampersand {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: var(--gold);
      margin: 2px 0;
      position: relative;
      letter-spacing: 3px;
    }
    .ampersand::before, .ampersand::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 52px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .ampersand::before { right: calc(50% + 18px); }
    .ampersand::after {
      left: calc(50% + 18px);
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .rings {
      display: flex;
      justify-content: center;
      margin: 8px 0 4px;
    }
    .rings svg {
      width: 60px;
      height: 34px;
      filter: drop-shadow(0 0 8px rgba(201,168,76,0.5));
    }

    .floral-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 16px 0 18px;
      opacity: 0.8;
    }
    .floral-divider .line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .floral-divider .line.right { background: linear-gradient(90deg, var(--gold), transparent); }
    .floral-divider svg { width: 28px; height: 28px; fill: var(--gold); }

    .body-text {
      text-align: center;
      font-size: 16px;
      color: #4a3028;
      line-height: 1.75;
      margin: 0 0 22px;
      padding: 0 8px;
    }

    .info-row {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    .info-box {
      flex: 1;
      min-width: 110px;
      background: linear-gradient(165deg, rgba(255,252,245,0.98), rgba(247,235,212,0.92));
      border: 1px solid rgba(201, 168, 76, 0.42);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.75);
      position: relative;
      overflow: hidden;
    }
    .info-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .info-icon {
      width: 28px;
      height: 28px;
      margin: 0 auto 8px;
      display: block;
    }
    .info-icon svg {
      width: 100%;
      height: 100%;
      fill: var(--gold-deep);
      opacity: 0.9;
    }

    .info-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 6px;
      opacity: 0.85;
    }
    .info-value {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--deep);
      line-height: 1.3;
    }
    .info-value.small {
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.45;
    }

    .hosts {
      text-align: center;
      margin: 22px 0 8px;
      padding-top: 18px;
      border-top: 1px solid rgba(201, 168, 76, 0.28);
      position: relative;
    }
    .hosts::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #f7ebd8;
      border: 1px solid var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 0 3px #f7ebd8;
    }
    .hosts-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 8px;
    }
    .hosts-names {
      font-size: 15.5px;
      color: #4a3028;
      line-height: 1.6;
    }

    .closing {
      text-align: center;
      font-size: 15px;
      color: #5c4033;
      line-height: 1.7;
      margin-top: 18px;
      font-style: italic;
    }

    .venue-strip {
      margin-top: 28px;
      border-radius: 12px;
      overflow: hidden;
      height: 115px;
      background: linear-gradient(90deg, #1a0c0e, #3d1520, #4a1a28, #3d1520, #1a0c0e);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.45);
    }
    .venue-strip::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(201,168,76,0.22), transparent 48%),
        radial-gradient(ellipse at 70% 50%, rgba(201,168,76,0.15), transparent 48%);
      animation: venueGlow 4.5s ease-in-out infinite alternate;
    }
    @keyframes venueGlow {
      from { opacity: 0.65; }
      to { opacity: 1; }
    }
    .venue-name {
      font-family: 'Cinzel', serif;
      font-size: 19px;
      letter-spacing: 6px;
      color: var(--gold-bright);
      text-shadow: 0 2px 14px rgba(0,0,0,0.65), 0 0 35px rgba(201,168,76,0.35);
      z-index: 1;
      position: relative;
    }
    .venue-sub {
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(232, 212, 139, 0.7);
      text-transform: uppercase;
      z-index: 1;
      position: relative;
    }

    .floral-bottom {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      opacity: 0.75;
    }
    .floral-bottom svg {
      width: 160px;
      height: 32px;
      fill: var(--gold);
    }

    .music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8d48b, #c9a84c, #8a6d1d);
      border: 2px solid rgba(255, 245, 210, 0.45);
      box-shadow: 0 10px 32px rgba(201, 168, 76, 0.5), 0 0 0 5px rgba(92, 26, 38, 0.18);
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s;
      opacity: 0;
      pointer-events: none;
    }
    .music-btn.visible {
      opacity: 1;
      pointer-events: auto;
      animation: musicPulse 2.8s ease-in-out infinite;
    }
    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 10px 32px rgba(201, 168, 76, 0.5), 0 0 0 5px rgba(92, 26, 38, 0.18); }
      50% { box-shadow: 0 10px 32px rgba(201, 168, 76, 0.7), 0 0 0 9px rgba(92, 26, 38, 0.12); }
    }
    .music-btn:active { transform: scale(0.9); }
    .music-btn svg { width: 24px; height: 24px; fill: #1a0c0e; }

    .petal {
      position: fixed;
      pointer-events: none;
      z-index: 44;
      width: 14px;
      height: 18px;
      background: radial-gradient(ellipse at 30% 30%, #e8a0a8, #a84a58 70%);
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: petalFall 7s ease-in forwards;
      box-shadow: 0 0 6px rgba(168, 74, 88, 0.4);
    }
    @keyframes petalFall {
      0% { opacity: 0; transform: translateY(-30px) rotate(0deg) translateX(0); }
      8% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(110vh) rotate(420deg) translateX(50px); }
    }

    .gold-spark {
      position: fixed;
      pointer-events: none;
      z-index: 45;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #e8d48b, #c9a84c);
      border-r
